<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo FM WebDev | Utilidades & Ferramentas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-900 min-h-screen flex items-center justify-center p-2 sm:p-4 text-slate-800"
  >
    <!-- Mobile Frame / Canvas Container -->
    <div
      class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-700/50 flex flex-col min-h-[750px]"
    >
      <!-- Top App Bar -->
      <header
        class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center border-b border-slate-800 sticky top-0 z-50"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-black text-lg text-white shadow-lg shadow-blue-500/30"
          >
            FM
          </div>
          <div>
            <h1
              class="text-sm font-bold tracking-tight leading-none text-white"
            >
              FM WebDev
            </h1>
            <span class="text-[10px] text-slate-400 font-medium"
              >Catálogo de Utilidades</span
            >
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a
            href="{{ url_for('carrinho') }}"
            class="relative p-2 text-slate-300 hover:text-white transition-colors"
          >
            <i class="fa-solid fa-cart-shopping text-base"></i>
            <span
              class="absolute top-1 right-1 bg-blue-600 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border-2 border-slate-900"
              >1</span
            >
          </a>
          <a
            href="{{ url_for('admin') }}"
            class="p-2 text-slate-300 hover:text-white transition-colors"
            title="Painel Admin"
          >
            <i class="fa-solid fa-sliders text-base"></i>
          </a>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="flex-1 bg-slate-50 overflow-y-auto">
        {% block content %}{% endblock %}
      </main>

      <!-- Bottom Navigation Bar -->
      <nav
        class="bg-white border-t border-slate-200 px-6 py-2.5 flex justify-between items-center text-xs font-semibold text-slate-500 sticky bottom-0 z-50"
      >
        <a
          href="{{ url_for('catalogo') }}"
          class="flex flex-col items-center gap-1 text-blue-600"
        >
          <i class="fa-solid fa-store text-base"></i>
          <span>Catálogo</span>
        </a>
        <a
          href="{{ url_for('carrinho') }}"
          class="flex flex-col items-center gap-1 hover:text-slate-800 transition-colors"
        >
          <i class="fa-solid fa-basket-shopping text-base"></i>
          <span>Carrinho</span>
        </a>
        <a
          href="{{ url_for('admin') }}"
          class="flex flex-col items-center gap-1 hover:text-slate-800 transition-colors"
        >
          <i class="fa-solid fa-chart-line text-base"></i>
          <span>Painel</span>
        </a>
      </nav>
    </div>
  </body>
</html>
